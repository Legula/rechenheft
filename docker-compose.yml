# Philians Rechenheft für die Synology (Container Manager → Projekt)
# Die App ist danach unter http://<IP-der-Synology>:8088/ erreichbar.
# Der Lernstand liegt im Docker-Volume "rechenheft-daten", nicht im Webordner.
services:
  rechenheft:
    image: php:8.3-apache
    container_name: rechenheft
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      RECHENHEFT_DATA: /data
      # "aus" setzen, um automatische Updates abzuschalten
      RECHENHEFT_UPDATE_URL: https://raw.githubusercontent.com/Legula/rechenheft/main/index.html
      # Familien-Code, den Geräte ohne Code automatisch bekommen (leer = der zuletzt im Elternbereich gespeicherte)
      RECHENHEFT_CODE: ${RECHENHEFT_CODE:-}
      # Hausaufgaben-Wache: API-Schlüssel von console.anthropic.com.
      # Einfachster Weg: Datei "claude.env" neben diese Datei legen (Inhalt: ANTHROPIC_API_KEY=sk-ant-... oder nur der Schlüssel).
      # wache.php liest sie direkt, ohne Neustart. Alternativ .env oder den Wert hier eintragen.
      # Ohne Schlüssel zeigt die Wache freundlich "noch nicht eingerichtet", der Rest der App läuft normal.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Höchstens so viele Anfragen an Paul pro Tag (Kostenbremse)
      WACHE_LIMIT: "60"
    volumes:
      - ./:/var/www/html:ro
      - rechenheft-daten:/data
    # index.php liefert die App aus und holt neue Versionen automatisch von GitHub (stündlich).
    # Apache gibt claude.env, .env, docker-compose.yml und andere Hilfsdateien nicht im Browser heraus (der Schlüssel bleibt geheim).
    command:
      - sh
      - -c
      - |
        chown -R www-data:www-data /data
        cat > /etc/apache2/conf-enabled/rechenheft.conf <<'CONF'
        DirectoryIndex index.php index.html
        <FilesMatch "(^\.|\.(ya?ml|md|env|txt|json)$$)">
          Require all denied
        </FilesMatch>
        CONF
        exec apache2-foreground

volumes:
  rechenheft-daten:
