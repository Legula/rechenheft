# Philians Rechenheft für die Synology (Container Manager → Projekt)
# Die App ist danach unter http://<IP-der-Synology>:8088/ erreichbar.
# Der Lernstand liegt im Docker-Volume "rechenheft-daten", nicht im Webordner.
services:
  rechenheft:
    image: php:8.3-apache
    container_name: rechenheft
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      RECHENHEFT_DATA: /data
      # "aus" setzen, um automatische Updates abzuschalten
      RECHENHEFT_UPDATE_URL: https://raw.githubusercontent.com/Legula/rechenheft/main/index.html
    volumes:
      - ./:/var/www/html:ro
      - rechenheft-daten:/data
    # index.php liefert die App aus und holt neue Versionen automatisch von GitHub (stündlich).
    command: sh -c "chown -R www-data:www-data /data && echo 'DirectoryIndex index.php index.html' > /etc/apache2/conf-enabled/rechenheft.conf && exec apache2-foreground"

volumes:
  rechenheft-daten:
